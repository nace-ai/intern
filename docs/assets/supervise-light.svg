y warn b a nudge" x="480" y="340">nudge → System 2: make the change as the next call</text><text class="note" x="32" y="392">A look at turn 4, then every fourth turn; a stuck look is checked again at the next turn, and the nudge goes out if it holds.</text><text class="note" x="32" y="412">0.6 s a look. Replayed over 42 stored runs (1,935 turns): 23 stuck nudges, System 1 asked at 27% of turns. Bars are illustrative.</text></svg>