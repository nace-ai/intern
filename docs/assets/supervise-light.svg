    .tag { fill: #f4f4f0; stroke: #e8e8e3; }
    .viotag { fill: #efe6ff; stroke: #7c4acc; }
    .tagtext { fill: #7c7c67; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { fill: #7c7c67; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
