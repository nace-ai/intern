    .tiny { fill: #7c7c67; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #0c0c09; } .b { font-weight: 650; }
    .ok { fill: #3fb55a; } .warn { fill: #b7791f; } .bad { fill: #b23a3a; } .vio { fill: #7c4acc; }
    .faded { opacity: 0.45; }
    .edge { stroke: #e8e8e3; stroke-width: 2.5; fill: none; }
    .flow { stroke: #d3d1c6; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 1 11;
      animation: flow 0.9s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }
    .dot { fill: #0c0c09; filter: url(#soft); }
    .viodot { fill: #7c4acc; } .warndot { fill: #b7791f; } .okdot { fill: #3fb55a; } .baddot { fill: #b23a3a; }
    .chip { fill: #f4f4f0; stroke: #e8e8e3; }
    .pip { fill: none; stroke: #d3d1c6; stroke-width: 1.5; }
    .pipon { fill: #b7791f; }
    .track { fill: #f4f4f0; stroke: #e8e8e3; }
    .bar { fill: #d3d1c6; }
    .threshold { stroke: #7c7c67; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .state { fill: #3fb55a; opacity: 0.18; stroke: #3fb55a; }
    .block { fill: #ffffff; stroke: #d3d1c6; }
    .eye { fill: #ffffff; stroke: #7c4acc; stroke-width: 2; }
    .rest { fill: #d3d1c6; }
