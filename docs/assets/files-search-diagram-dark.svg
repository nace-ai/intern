<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img" aria-label="decision_files searching a folder of audit papers for: has the client ever been the victim of a scam or theft, and what did it cost? Two lanes run at once. System 1 walks the folder&#x27;s 7 files and their pages: the internal control questionnaire 0.95, the going-concern questionnaire 0.91 and the fraud-risk questionnaire 0.90. BM25 ranks the top 6 of 29 passages by their words. System 1 judges both lanes together, 7 passages; the best passages&#x27; 20 terms find 15 more, and System 1 judges all 22. Result: page 1 of the fraud-risk questionnaire, found by both lanes, at 0.98. 13 asks, $0.0021, 3.1 s, on drex-max, the same run as the terminal recording."><style>
