<title id="t">Pass rate against cost per task on Terminal-Bench 2.1, 87 tasks</title>
<desc id="d">Intern starting each task on Opus 5.5 and handing over to Hy4 Flash: 92.4% at $0.127 a task. Opus 5.5 alone: Pi 93.7% at $0.291, Hermes 92.4% at $0.280, OpenCode 91.1% at $0.393. Hy4 Flash alone: OpenCode 83.5% at $0.0066, Hermes 82.3% at $0.0075, Pi 82.3% at $0.0068. The Pareto frontier runs from OpenCode on Hy4 Flash through Intern to Pi on Opus 5.5.</desc>
