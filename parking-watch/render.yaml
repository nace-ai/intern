services:
  - type: web
    name: parking-watch
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REQUIRE_AUTH
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: WATCH_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: ALERT_TO
        sync: false
    # For durable event history and timer across deployments, configure a
    # paid persistent disk and set DATABASE_PATH to its mount location.
