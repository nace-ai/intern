name: Agent Heist offline verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-heist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-heist/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:worker
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run audit:secrets
      - run: npm run audit:repo
