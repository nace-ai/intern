[metadata]
name = dates-in-text
version = attr: dates.__version__
description = Find the dates written in text, and read them as dates.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License

[options]
package_dir =
    dates = src
packages = dates
python_requires = >=3.10

[options.extras_require]
test =
    pytest>=8

[options.entry_points]
console_scripts =
    dates = dates.cli:main

[tool:pytest]
addopts = -q
testpaths = tests
