[project]
name = "intern-agent"
version = "0.53.0"
description = "An agent harness for models of 35B parameters or less, with a second model watching every turn"
readme = "README.md"
license = "LicenseRef-Nace-AI-Open-RAIL-M"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Nace AI" }]
dependencies = [
    "agent-client-protocol>=0.9,<0.10",
    "httpcore>=1.0,<2",
    "httpx>=0.27",
    "pillow>=10",
    "pydantic>=2.8",
    "textual>=8,<9",
    "tomlkit>=0.13",
]

[project.scripts]
intern = "intern.cli:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.58,<2",
]
code-search = [
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    # The grammars `locate/symbols.py` chunks code by; a language without its grammar is chunked by windows of lines.
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-bash>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-php>=0.25",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-sql>=0.3.11",
    "tree-sitter-swift>=0.7",
    "tree-sitter-typescript>=0.23",
]
mcp = [
    "jsonschema>=4.23",
    "mcp>=1.30,<2",
]
# Empty: ACP is in every install, which the desktop app needs. Kept so `intern-agent[acp]` still resolves.
acp = []
opensandbox = [
    "opensandbox>=1.2,<2",
]
workspace = [
    "duckdb>=1.1",
    "networkx>=3.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # DuckDB's Python client needs it to return a TIMESTAMP WITH TIME ZONE (a CSV's 2024-01-01T00:00:00Z): without
    # it such a file fails to index and a query over such a column fails.
    "pytz>=2024.1",
    "xlrd>=2.0",
]
ocr = [
    "opencv-python-headless>=4.9",
    "rapidocr-onnxruntime>=1.4",
]

[project.entry-points."intern.runners"]
opensandbox = "intern.runners.opensandbox:OpenSandboxRunner"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intern"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: calls a real model API; skipped unless INTERN_LIVE_MODEL is set"]
