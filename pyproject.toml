[project]
name = "swarm-orchestra"
version = "0.1.0"
description = "A swarm of Drex-driven musicians that listen to each other and improvise live."
authors = [
    { name = "Jorge Menjivar", email = "jorgemenjivar1997@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "music21>=10.5.2",
]

[dependency-groups]
dev = [
    "mido>=1.3.3",
    "ruff>=0.17.5",
    "textual>=8.2.8",
    "ty>=0.0.104",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
