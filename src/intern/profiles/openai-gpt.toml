# OpenAI's GPT-5 models with a 400K context and 128K output: GPT-5 (and mini, nano), 5.1, 5.2 (and Pro), 5.3 Codex,
# 5.4 mini and nano. OpenAI's own model listing gives no window and no modalities, so the profile does (through
# OpenRouter the listing says them). The window is the most input a request takes, 272K: OpenAI's model pages
# say so for GPT-5, mini, nano, 5.3 Codex, 5.4 mini and nano. They give none for 5.1, 5.2 and 5.2 Pro, which
# refused 273K and took 271K (5.2 Pro 231K, the most a request here sends), measured 2026-11-15.
# https://developers.openai.com/api/docs/models, read 2026-11-15.

match = ["openai/gpt-5*"]
window = 272000
max_output_tokens = 128000
vision = true
