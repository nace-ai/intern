# gpt-live-1 does not reason: the Responses API refuses `reasoning.effort` from it ("'reasoning.effort' is not
# supported with this model", 2026-11-17), so sessions on it offer no level. GPT-4o and GPT-4.1, which refuse it too,
# have profiles of their own with their windows (openai-gpt-4o.toml, openai-gpt-4-1.toml).

match = ["openai/gpt-live-*"]
effort_levels = []
