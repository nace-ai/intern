# Claude Opus 4.5. Window and output cap as the Models API reports them (200K in, 64K out). It rejects adaptive
# thinking, so it thinks on a fixed budget. Sonnet and Haiku 4.5, which take no effort level, have their own profile
# (claude-4-5-no-effort.toml), as this one but for that.

match = ["anthropic/claude-opus-4-5*"]
window = 200000
max_output_tokens = 64000
vision = true

# shortcut: a fixed budget, which a reply cap under 10K (a window capped below about 67K) is refused for; size it
# from the reply cap if anyone runs these that small.
[compat.extra_body.thinking]
type = "enabled"
budget_tokens = 10000
display = "summarized"
