<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Drex Army vs LLM Army</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.972 0.005 255);
    --field: oklch(0.945 0.009 255);
    --grid: oklch(0.905 0.011 255);
    --line: oklch(0.86 0.012 255);
    --ink: oklch(0.22 0.025 262);
    --ink-2: oklch(0.45 0.022 262);
    --control: oklch(0.995 0.002 255);
    --blue: oklch(0.52 0.18 258);
    --blue-tint: oklch(0.93 0.035 258);
    --red: oklch(0.56 0.2 27);
    --red-tint: oklch(0.94 0.03 27);
    --warn: oklch(0.55 0.19 35);
    --go: oklch(0.42 0.12 160);
    --sans: 'Barlow', system-ui, sans-serif;
    --cond: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 var(--sans); }
  button, select, input { font: inherit; color: inherit; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 24px 0; }
  h1 { margin: 0; font: 700 30px/1 var(--cond); letter-spacing: 0.01em; text-transform: uppercase; }
  h1 .b { color: var(--blue); } h1 .r { color: var(--red); } h1 .vs { color: var(--ink-2); font-weight: 500; padding: 0 6px; }
  .conn { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .conn[data-state="on"]::before { background: var(--go); }
  .conn[data-state="off"]::before { background: var(--warn); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
  .matchup { display: flex; align-items: center; gap: 10px; }
  .matchup .vs { color: var(--ink-2); font: 600 14px var(--cond); text-transform: uppercase; }
  .matchup label.blue { color: var(--blue); } .matchup label.red { color: var(--red); }
  select, input[type=number] { background: var(--control); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 34px; }
  input[type=checkbox] { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
  .spacer { flex: 1; }
  button { background: var(--control); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; min-height: 34px; cursor: pointer;
    transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
  button:hover { border-color: var(--ink-2); }
  button:active { transform: translateY(1px); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
  button.primary:hover { background: oklch(0.32 0.03 262); }

  .presets { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 24px; }
  .presets .label { color: var(--ink-2); font-size: 14px; margin-right: 4px; }
  .presets button { font-size: 14px; padding: 6px 12px; }

  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; padding: 6px 24px 16px; }
  .team { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .team.red { flex-direction: row-reverse; text-align: right; }
  .team .who { min-width: 0; }
  .team .side { font: 600 13px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; }
  .team .name { font: 600 24px/1.1 var(--cond); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.blue .side, .team.blue .kills { color: var(--blue); }
  .team.red .side, .team.red .kills { color: var(--red); }
  .kills { font: 700 64px/0.9 var(--cond); font-variant-numeric: tabular-nums; display: inline-block; transform-origin: center; }
  .clock { text-align: center; }
  #clock { font: 600 28px/1 var(--cond); font-variant-numeric: tabular-nums; }
  #banner { color: var(--ink-2); font-size: 14px; margin-top: 4px; max-width: 36ch; }
  #banner[data-win="blue"] { color: var(--blue); font-weight: 600; }
  #banner[data-win="red"] { color: var(--red); font-weight: 600; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; padding: 0 24px 32px; align-items: start; }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--field); cursor: crosshair; }
  aside > section { padding: 4px 0 18px; }
  aside > section + section { border-top: 1px solid var(--line); padding-top: 14px; }
  h2 { margin: 0 0 10px; font: 600 18px var(--cond); text-transform: uppercase; letter-spacing: 0.03em; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tape td { padding: 6px 0; border-bottom: 1px solid var(--grid); }
  .tape td.metric { text-align: center; color: var(--ink-2); font-size: 13px; width: 40%; }
  .tape td.bv { text-align: left; } .tape td.rv { text-align: right; }
  .tape td.bv, .tape td.rv { font: 600 20px var(--cond); color: var(--ink-2); }
  .tape td.bv.lead { color: var(--blue); } .tape td.rv.lead { color: var(--red); }
  .tape tr:last-child td { border-bottom: 0; }
  .err { margin: 8px 0 0; color: var(--warn); font-size: 13px; overflow-wrap: anywhere; }
  .err:empty { display: none; }

  .unit-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .unit-head b { font: 600 18px var(--cond); }
  .hint { color: var(--ink-2); font-size: 14px; }
  .prob { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 6px; font-size: 13px; }
  .prob .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--blue-tint); overflow: hidden; }
  .prob .track i { display: block; width: 100%; height: 100%; background: oklch(0.72 0.1 258); border-radius: 3px; transform-origin: left; transition: transform 200ms var(--ease); }
  .prob.top .track i { background: var(--blue); }
  .prob.top span:first-child { font-weight: 600; }
  .prob span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); }

  .bench th, .bench td { padding: 5px 4px; text-align: right; font-size: 13px; border-bottom: 1px solid var(--grid); }
  .bench th { color: var(--ink-2); font-weight: 500; }
  .bench th:first-child, .bench td:first-child { text-align: left; }
  .bench td.b { color: var(--blue); font-weight: 600; } .bench td.r { color: var(--red); font-weight: 600; }
  .bench-meta { color: var(--ink-2); font-size: 13px; margin-bottom: 6px; }

  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; }
    .scoreboard { grid-template-columns: 1fr 1fr; }
    .clock { grid-column: 1 / -1; grid-row: 1; }
    .kills { font-size: 48px; }
  }
  @media (max-width: 560px) {
    .top, .controls, .presets, .scoreboard, main { padding-left: 16px; padding-right: 16px; }
    .spacer { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1><span class="b">Drex Army</span><span class="vs">vs</span><span class="r">LLM Army</span></h1>
  <div class="conn" id="conn">Connecting</div>
</header>

<section class="controls" aria-label="Match setup">
  <div class="matchup">
    <label class="blue">Blue <select id="blue"><option>drex</option><option>scripted</option><option>llm</option></select></label>
    <span class="vs">vs</span>
    <label class="red">Red <select id="red"><option>llm</option><option>scripted</option><option>drex</option></select></label>
  </div>
  <label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
  <label><input type="checkbox" id="paused" /> Paused mode</label>
  <label title="Adds crates on the midline and a 7th order, collect_supply. Off = the benchmarked rules."><input type="checkbox" id="supplies" /> Supply crates</label>
  <label>Units <input id="units" type="number" value="10" min="1" max="50" style="width:64px" /></label>
  <span class="spacer"></span>
  <button id="stop">Stop</button>
  <button class="primary" id="start">Start match</button>
</section>

<nav class="presets" aria-label="Stage presets">
  <span class="label">Presets</span>
  <button data-preset="drex,llm,1,0">Live 1×: Drex vs LLM</button>
  <button data-preset="drex,llm,2,0">Live 2×: Drex vs LLM</button>
  <button data-preset="drex,llm,1,1">Paused, quality only: Drex vs LLM</button>
  <button data-preset="drex,scripted,1,0">Drex vs Scripted</button>
  <button data-preset="scripted,scripted,2,0">Scripted mirror</button>
</nav>

<section class="scoreboard" id="versus" aria-live="polite">
  <div class="team blue">
    <div class="kills" id="blueKills">0</div>
    <div class="who"><div class="side">Blue</div><div class="name" id="blueName">Drex</div></div>
  </div>
  <div class="clock"><div id="clock">0.0 / 60s</div><div id="banner">Pick a preset to start a match</div></div>
  <div class="team red">
    <div class="kills" id="redKills">0</div>
    <div class="who"><div class="side">Red</div><div class="name" id="redName">LLM</div></div>
  </div>
</section>

<main>
  <canvas id="cv" width="1000" height="600" aria-label="Battlefield"></canvas>
  <aside>
    <section>
      <h2>Head to head</h2>
      <table class="tape"><tbody id="tape"><tr><td class="hint" colspan="3">Live numbers appear when a match starts.</td></tr></tbody></table>
      <p class="err" id="errBlue"></p><p class="err" id="errRed"></p>
    </section>
    <section>
      <h2>Selected unit</h2>
      <div id="unitInfo"><p class="hint">Click a blue unit to see how Drex weighed each order.</p></div>
    </section>
    <section id="results" hidden>
      <h2>Benchmark</h2>
      <div id="resultsBody"></div>
    </section>
  </aside>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
