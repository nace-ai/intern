[project]
name = "nace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rahuldadlani03", email = "rrdadlan@ucsd.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
]

[project.scripts]
nace = "nace:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
